name: CI/CD — OAT Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: "20"

jobs:
  # ─────────────────────────────────────────────────────────────────
  # JOB 1: Lint & Type Check
  # ─────────────────────────────────────────────────────────────────
  lint:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run lint

  # ─────────────────────────────────────────────────────────────────
  # JOB 2: Build Docker Image (validasi Dockerfile berjalan)
  # ─────────────────────────────────────────────────────────────────
  build:
    name: 🐳 Build & Validate Docker Image
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (dry-run, tanpa push)
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          push: false
          tags: oat-security:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────
  # JOB 3: Deploy ke Coolify (trigger webhook)
  # ─────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy ke Coolify
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Coolify Deployment
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            -X GET "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}")

          echo "Coolify response status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 201 ]; then
            echo "❌ Coolify deployment trigger gagal (HTTP $HTTP_STATUS)"
            exit 1
          fi

          echo "✅ Coolify deployment berhasil di-trigger!"

      - name: Notifikasi sukses
        if: success()
        run: |
          echo "🎉 Deployment OAT Security berhasil!"
          echo "🌐 Domain: https://aotsecurity.neverlandstudio.ai.id"
          echo "📦 Commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"

