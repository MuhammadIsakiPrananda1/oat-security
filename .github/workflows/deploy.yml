name: CI/CD — OAT Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────
  # 1. Type Check
  # ──────────────────────────────────────────────
  lint:
    name: 🔍 Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  # ──────────────────────────────────────────────
  # 2. Build & Push Docker image ke GHCR
  # ──────────────────────────────────────────────
  build:
    name: 🐳 Build & Push Image
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.image.outputs.name }}

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Login ke GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR wajib lowercase
      - name: Set image name (lowercase)
        id: image
        run: |
          NAME=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "name=$NAME" >> $GITHUB_OUTPUT

      - name: Build & Push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # 3. Deploy ke Server via SSH
  # ──────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 49218 }}
          envs: GITHUB_REPOSITORY,GITHUB_ACTOR
          script: |
            set -e

            # Image name lowercase
            IMAGE=$(echo "ghcr.io/$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')

            mkdir -p /opt/oat-security

            # Bersihkan newline dari secrets (karena openssl rand -base64 menghasilkan multiline)
            JWT_RAW="${{ secrets.JWT_SECRET }}"
            SESSION_RAW="${{ secrets.SESSION_SECRET }}"
            DB_PASS_RAW="${{ secrets.DB_PASSWORD }}"
            DB_ROOT_RAW="${{ secrets.DB_ROOT_PASSWORD }}"
            GEMINI_RAW="${{ secrets.GEMINI_API_KEY }}"
            GROQ_RAW="${{ secrets.GROQ_API_KEY }}"

            JWT_CLEAN=$(printf '%s' "$JWT_RAW" | tr -d '\r\n ')
            SESSION_CLEAN=$(printf '%s' "$SESSION_RAW" | tr -d '\r\n ')
            DB_PASS_CLEAN=$(printf '%s' "$DB_PASS_RAW" | tr -d '\r\n ')
            DB_ROOT_CLEAN=$(printf '%s' "$DB_ROOT_RAW" | tr -d '\r\n ')
            GEMINI_CLEAN=$(printf '%s' "$GEMINI_RAW" | tr -d '\r\n ')
            GROQ_CLEAN=$(printf '%s' "$GROQ_RAW" | tr -d '\r\n ')

            # Tulis .env dari GitHub Secrets (bersih tanpa newline atau spasi perusak)
            cat > /opt/oat-security/.env << ENVEOF
NODE_ENV=production
HOST=0.0.0.0
PORT=3000
DB_HOST=oat_db
DB_PORT=3306
DB_NAME=oat_security
DB_USER=oat
DB_PASSWORD=${DB_PASS_CLEAN}
DB_ROOT_PASSWORD=${DB_ROOT_CLEAN}
JWT_SECRET=${JWT_CLEAN}
SESSION_SECRET=${SESSION_CLEAN}
CORS_ORIGINS=https://aotsecurity.neverlandstudio.ai.id
LOG_LEVEL=info
GEMINI_API_KEY=${GEMINI_CLEAN}
GROQ_API_KEY=${GROQ_CLEAN}
AGENT_BIN_DIR=./agent/dist
SUPPORT_HOURS=24/7 SOC
ENVEOF

            # Tulis docker-compose.prod.yml
            cat > /opt/oat-security/docker-compose.prod.yml << COMPOSEEOF
version: "3.9"
services:
  db:
    image: mysql:8.0
    container_name: oat_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: \${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: \${DB_NAME:-oat_security}
      MYSQL_USER: \${DB_USER:-oat}
      MYSQL_PASSWORD: \${DB_PASSWORD}
    env_file: [.env]
    volumes:
      - oat_db_data:/var/lib/mysql
    networks: [oat_net]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  app:
    image: ${IMAGE}:latest
    container_name: oat_app
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    env_file: [.env]
    ports: ["127.0.0.1:3000:3000"]
    networks: [oat_net]
volumes:
  oat_db_data:
networks:
  oat_net:
COMPOSEEOF

            # Pull image terbaru dan deploy
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin
            docker pull $IMAGE:latest

            cd /opt/oat-security
            IMAGE=$IMAGE docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

            echo ""
            echo "✅ Deploy selesai!"
            echo "🌐 https://aotsecurity.neverlandstudio.ai.id"
            docker compose -f docker-compose.prod.yml ps
