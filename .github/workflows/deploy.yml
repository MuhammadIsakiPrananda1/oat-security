name: CI/CD — OAT Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────
  # 1. Type Check
  # ──────────────────────────────────────────────
  lint:
    name: 🔍 Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  # ──────────────────────────────────────────────
  # 2. Build & Push Docker image ke GHCR
  # ──────────────────────────────────────────────
  build:
    name: 🐳 Build & Push Image
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # 3. Deploy ke Server via SSH
  # ──────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            mkdir -p /opt/oat-security

            # Tulis .env langsung dari GitHub Secrets (tidak pernah disimpan di repo)
            cat > /opt/oat-security/.env << 'ENVEOF'
            NODE_ENV=production
            HOST=0.0.0.0
            PORT=3000
            DB_HOST=oat_db
            DB_PORT=3306
            DB_NAME=oat_security
            DB_USER=oat
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            SESSION_SECRET=${{ secrets.SESSION_SECRET }}
            CORS_ORIGINS=https://aotsecurity.neverlandstudio.ai.id
            LOG_LEVEL=info
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            AGENT_BIN_DIR=./agent/dist
            SUPPORT_HOURS=24/7 SOC
            ENVEOF

            # Login ke GHCR dan pull image terbaru
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ github.repository }}:latest

            # Copy docker-compose ke server dan deploy
            cat > /opt/oat-security/docker-compose.prod.yml << 'COMPOSEEOF'
            version: "3.9"
            services:
              db:
                image: mysql:8.0
                container_name: oat_db
                restart: unless-stopped
                env_file: [.env]
                environment:
                  MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
                  MYSQL_DATABASE: ${DB_NAME:-oat_security}
                  MYSQL_USER: ${DB_USER:-oat}
                  MYSQL_PASSWORD: ${DB_PASSWORD}
                volumes:
                  - oat_db_data:/var/lib/mysql
                networks: [oat_net]
                healthcheck:
                  test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
                  interval: 10s
                  timeout: 5s
                  retries: 5
                  start_period: 30s
              app:
                image: ghcr.io/${{ github.repository }}:latest
                container_name: oat_app
                restart: unless-stopped
                depends_on:
                  db: {condition: service_healthy}
                env_file: [.env]
                ports: ["127.0.0.1:3000:3000"]
                networks: [oat_net]
            volumes:
              oat_db_data:
            networks:
              oat_net:
            COMPOSEEOF

            cd /opt/oat-security
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

            echo "✅ Deploy selesai — https://aotsecurity.neverlandstudio.ai.id"
