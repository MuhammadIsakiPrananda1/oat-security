version: "3.9"

services:
  # ─── Database MySQL ───────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: oat_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-oat_security}
      MYSQL_USER: ${DB_USER:-oat}
      MYSQL_PASSWORD: ${DB_PASSWORD:-oat_security_2026}
    volumes:
      - oat_db_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - oat_network

  # ─── Aplikasi OAT Security ────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: oat_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-oat_security}
      DB_USER: ${DB_USER:-oat}
      DB_PASSWORD: ${DB_PASSWORD:-oat_security_2026}
      JWT_SECRET: ${JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://oatsecurity.neverlandstudio.ai.id}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AGENT_BIN_DIR: ./agent/dist
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      SUPPORT_PHONE: ${SUPPORT_PHONE:-}
      SUPPORT_ADDRESS: ${SUPPORT_ADDRESS:-}
      SUPPORT_HOURS: ${SUPPORT_HOURS:-24/7 SOC}
      SUPPORT_SLA: "${SUPPORT_SLA:-Critical incidents: 15 minutes · Standard requests: 1 business day}"
    ports:
      - "3000:3000"
    volumes:
      - oat_agent_logs:/app/logs
    networks:
      - oat_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  oat_db_data:
    driver: local
  oat_agent_logs:
    driver: local

networks:
  oat_network:
    driver: bridge

