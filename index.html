    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <script>
      // Apply the persisted theme before the first paint so switching between
      // light and dark never flashes the wrong palette on reload.
      (function () {
        var mode = 'light';
        try {
          var stored = localStorage.getItem('oat-theme-mode');
          if (stored === 'dark' || stored === 'light' || stored === 'system') mode = stored;
        } catch (e) { /* storage unavailable */ }
        var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.classList.toggle('dark', dark);
        root.classList.toggle('light', !dark);
      })();
    </script>
    <title>OAT SECURITY - Enterprise Cybersecurity Platform</title>
    <meta name="description" content="Enterprise-grade WAF, firewall, threat detection, and security monitoring untuk melindungi website, aplikasi, dan jaringan bisnis Anda." />
